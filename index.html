<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지하철 자리 쟁탈전</title>
<style>
:root{--bg:#eceae3;--fg:#1b1f24;--panel:#ffffff;--edge:#cfd2d6;--acc:#00934a;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--fg:#eef1f3;--panel:#1b2128;--edge:#323b45;--acc:#2fd37a;--accfg:#06210f}}
:root[data-theme="dark"]{--bg:#101418;--fg:#eef1f3;--panel:#1b2128;--edge:#323b45;--acc:#2fd37a;--accfg:#06210f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#wrap{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
#cw{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#mt{position:absolute;right:10px;bottom:8px;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--panel);color:var(--fg);font-size:20px;cursor:pointer;z-index:3;padding:0}
#mt:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
#ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;padding:10px 12px 12px}
#ctl button{height:76px;border-radius:18px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);font:800 28px inherit;font-family:inherit;touch-action:manipulation;cursor:pointer}
#ctl #bs{background:var(--acc);color:var(--accfg);border-color:transparent;font-size:30px}
#ctl button:active{transform:scale(.97)}
#ctl button:focus-visible,.ov button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,12,16,.8);color:#fff;padding:24px}
.ov #oi{display:flex;gap:6px;justify-content:center;align-items:flex-end;margin-bottom:12px}.ov #oi img{height:72px}
.ov h1{font-size:clamp(28px,8vw,42px);margin:0 0 12px;font-weight:900;letter-spacing:-.02em}
.ov p{white-space:pre-line;line-height:1.75;margin:0 0 18px;font-size:16px;max-width:22em;opacity:.93}
.ov button{padding:14px 30px;border:0;border-radius:999px;background:var(--acc);color:var(--accfg);font:800 17px inherit;font-family:inherit;margin:5px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<div id="cw"><canvas id="c"></canvas><button id="mt" aria-label="소리 켜기/끄기">🔊</button></div>
<div id="ctl"><button id="bl" aria-label="왼쪽으로">◀</button><button id="bs">앉기!</button><button id="br" aria-label="오른쪽으로">▶</button></div>
<div id="ov" class="ov"><div id="oi"></div><h1 id="ot"></h1><p id="op"></p><div id="ob"></div></div>
</div>

const SEATP=['ai','bujang','sangmu'],RV=['bujang','sangmu','ai'],NM={ai:'AI',bujang:'부장님',maknae:'막내',sangmu:'상무님'};
const IMG={};for(const k in SRC){const im=new Image();im.src=SRC[k].u;IMG[k]=im}
$('oi').innerHTML=['maknae','bujang','sangmu','ai'].map(k=>`<img alt="${NM[k]}" src="${SRC[k].u}">`).join('');
const STN=['신도림','강남','홍대입구','잠실','건대입구','사당','왕십리','서울역','종로3가','여의도'];
const rnd=n=>Math.floor(Math.random()*n);
const sw=()=>W*.88/7,sx=i=>W*.06+sw()*(i+.5);
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

let rd=0,sc=0,life=3,combo=0,wins=0,ph='title',t=0,R=null,msg=null,lock=0,px=3,pxv=3,shake=0,best=0,wy=0,ws=0,it=0,pt=0;
try{best=+localStorage.getItem('subBest')||0}catch(e){}

function say(s,l,c){msg={s,l,m:l,c:c||'#fff'}}
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}

let AC=null,MG=null,SG=null,muted=false,nextT=0,stp=0,sch=0,NB=null;
try{muted=localStorage.getItem('subMute')==='1'}catch(e){}
function audioInit(){
  if(!AC){try{
    AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();SG=AC.createGain();
    MG.connect(AC.destination);SG.connect(AC.destination);
    NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.2),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;return}}
  setVol();if(AC.state==='suspended')AC.resume();
}
function setVol(){if(AC){MG.gain.value=muted?0:.5;SG.gain.value=muted?0:.9}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,ty,v,dst){
  const o=AC.createOscillator(),gn=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(gn);gn.connect(dst);o.start(t);o.stop(t+d+.05);
}
function hat(t,v){
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=NB;f.type='highpass';f.frequency.value=6500;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.05);
  s.connect(f);f.connect(gn);gn.connect(MG);s.start(t);s.stop(t+.06);
}
const MEL=[[72,0,76,79,76,0,74,72],[69,0,72,76,81,0,79,76],[77,0,76,72,74,0,76,77],[74,0,79,79,77,0,76,74]],BAS=[48,45,41,43];
function sched(){
  if(!AC||AC.state!=='running')return;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  const spb=60/Math.min(152,112+rd*4)/2;
  while(nextT<AC.currentTime+.15){
    const b=(stp>>3)&3,k=stp&7,m=MEL[b][k],t=nextT;
    if(m)tone(mf(m),t,spb*1.6,'square',.07,MG);
    if(k%2===0)tone(mf(BAS[b]+(k===2||k===6?7:0)),t,spb*1.8,'triangle',.18,MG);
    if(k%2===1)hat(t,.05);
    nextT+=spb;stp++;
  }
}
function startMusic(){if(!AC)return;stp=0;nextT=AC.currentTime+.1;clearInterval(sch);sch=setInterval(sched,50)}
function stopMusic(){clearInterval(sch)}
function sfx(n){
  if(!AC||muted||AC.state!=='running')return;const t=AC.currentTime;
  if(n==='chime'){tone(659,t,.5,'sine',.25,SG);tone(523,t+.28,.7,'sine',.25,SG)}
  else if(n==='win')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.25,'square',.12,SG));
  else if(n==='lose')[392,330,262,196].forEach((f,i)=>tone(f,t+i*.13,.3,'triangle',.25,SG));
  else if(n==='bad')tone(140,t,.18,'sawtooth',.12,SG);
  else if(n==='move')tone(520,t,.05,'triangle',.1,SG);
}

function mk(){
  const k=rd,RDv=Math.max(.2,.62-k*.045),wk=Math.max(.07,.14-k*.008);
  const nc=Math.min(4,2+(k>=3)+(k>=6)+(k>=8));
  const all=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5),cand=all.slice(0,nc),real=cand[rnd(nc)];
  const tUp=1.9+Math.random()*1.3,tFree=tUp+.5,nr=Math.min(3,1+(k>=3)+(k>=6)),riv=[];
  for(let i=0;i<nr;i++){
    const x=k>=4&&Math.random()<.6?cand[rnd(nc)]:rnd(7),d=Math.abs(x-real);
    riv.push({x,dur:Math.max(.2,d*wk),e:RV[i%3],ts:tFree+RDv+(Math.random()-.5)*.14+d*wk*.5});
  }
  const ts=Math.min(...riv.map(r=>r.ts));
  R={k,tUp,tFree,real,cand,riv,ts,who:riv.findIndex(r=>r.ts===ts),seats:Array.from({length:7},()=>SEATP[rnd(3)]),done:0,res:'',tf:1e9};
  t=0;lock=0;px=3;pxv=3;
}

function ov(a,b,btns){
  $('ot').textContent=a;$('op').textContent=b;const o=$('ob');o.innerHTML='';
  btns.forEach(([l,f])=>{const e=document.createElement('button');e.textContent=l;e.onclick=()=>f(e);o.appendChild(e)});
  $('ov').style.display='flex';
}
const hide=()=>{$('ov').style.display='none'};

function startGame(){audioInit();startMusic();hide();rd=0;sc=0;life=3;combo=0;wins=0;nextRound()}
function nextRound(){
  if(life<=0||rd>=10){end();return}
  mk();ph='intro';it=1.4;say(STN[rd]+'역 도착',1.2);sfx('chime');
}
function end(){
  ph='end';stopMusic();sfx(life<=0?'lose':'win');const rk=sc<600?'서서 가는 사람':sc<1400?'눈치 수련생':sc<2400?'앉기 고수':'자리 헌터';
  if(sc>best){best=sc;try{localStorage.setItem('subBest',best)}catch(e){}}
  const tx=`지하철 자리 쟁탈전 ${wins}/10 착석 · ${sc}점 [${rk}] ${location.href}`;
  setTimeout(()=>ov(life<=0?'결국 서서 갑니다…':'끝까지 앉았다!',`${wins}/10 착석 · ${sc}점\n칭호: ${rk}\n베스트 ${best}점`,[['결과 복사',b=>{try{navigator.clipboard.writeText(tx).then(()=>{b.textContent='복사됨!'}).catch(()=>{})}catch(e){}}],['다시 도전',startGame]]),700);
}

function mv(d){if((ph==='play'||ph==='intro')&&lock<=0){const n=Math.max(0,Math.min(6,px+d));if(n!==px)sfx('move');px=n}}
function sit(){
  if(ph!=='play'||R.done||lock>0)return;
  if(px===R.real&&t>=R.tFree){
    R.done=1;R.res='win';R.tf=t;const rt=t-R.tFree;combo++;wins++;
    const pts=100+Math.max(0,Math.round((.6-rt)*300))+combo*20;sc+=pts;
    say((rt<.2?'번개 착석! +':'착석! +')+pts,1.2,'#7dff9a');ph='res';pt=1.3;buzz(30);sfx('win');
  }else{
    lock=.5;combo=0;shake=6;sfx('bad');
    say(px===R.real&&t>=R.tUp?'아직 일어나는 중!':'그 자리는 사람이 있어요!',.8,'#ffd23f');
  }
}

function upd(dt){
  if(msg){msg.l-=dt;if(msg.l<=0)msg=null}
  shake*=.88;pxv+=(px-pxv)*Math.min(1,dt*18);if(lock>0)lock-=dt;
  if(ph==='intro'){it-=dt;ws=600*Math.max(0,it);if(it<=0){ph='play';t=0}}
  else if(ph==='play'){
    ws=0;t+=dt;
    if(!R.done&&t>=R.ts){R.done=1;R.res='lose';R.tf=t;life--;combo=0;shake=14;buzz(60);sfx('lose');say(NM[R.riv[R.who].e]+'에게 자리 뺏김! 😭',1.2,'#ff6b6b');ph='res';pt=1.3}
  }else if(ph==='res'){pt-=dt;ws=600*(1-Math.max(0,pt)/1.3);if(pt<=0){rd++;nextRound()}}
  wy+=ws*dt;
}

function tx(s,x,y,sz,al,c){
  g.font=`800 ${sz}px system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
  g.textAlign=al||'left';g.textBaseline='middle';g.lineWidth=4;g.lineJoin='round';
  g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(s,x,y);g.fillStyle=c||'#fff';g.fillText(s,x,y);
}
function em(e,x,y,sz,a){
  g.save();if(a!==undefined)g.globalAlpha=a;g.font=`${sz}px ${EF}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);g.restore();
}
function ch(k,x,yb,hh,a){const im=IMG[k];if(!im||!im.complete||!im.naturalWidth)return;const w=hh*SRC[k].a;g.save();if(a!==undefined)g.globalAlpha=a;g.drawImage(im,x-w/2,yb-hh,w,hh);g.restore()}
const rxf=r=>{
  const tt=Math.min(t,R.tf),st=r.ts-r.dur;if(tt<st)return r.x;
  const f=Math.min(1,(tt-st)/r.dur);return r.x+(R.real-r.x)*(1-(1-f)*(1-f));
};

function draw(now){
  g.clearRect(0,0,W,H);g.save();
  if(shake>.3)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const s=sw(),wy1=H*.11,wh=H*.15;
  g.fillStyle='#dcdad2';g.fillRect(-20,-20,W+40,H*.52+20);
  g.fillStyle='#00a84d';g.fillRect(-20,H*.075,W+40,H*.012);
  g.fillStyle='#0d1530';g.fillRect(W*.04,wy1,W*.92,wh);
  g.save();g.beginPath();g.rect(W*.04,wy1,W*.92,wh);g.clip();
  g.fillStyle='rgba(255,226,140,.85)';
  for(let i=0;i<16;i++){const x=(((i*83-wy)%W)+W)%W,y=wy1+8+(i*37)%(wh-16);g.fillRect(x,y,5+ws*.05,3)}
  if(ws<90){g.fillStyle='#00a84d';g.fillRect(W*.25,wy1+wh*.25,W*.5,wh*.5)}
  g.restore();
  if(ws<90)tx(STN[rd]||'',W/2,wy1+wh/2,Math.min(22,W*.06),'center');
  g.fillStyle='#dcdad2';[1,2].forEach(k=>g.fillRect(W*.04+W*.92*k/3-4,wy1,8,wh));
  g.fillStyle='#2a8a5c';g.fillRect(W*.04,H*.28,W*.92,H*.18);
  g.fillStyle='rgba(0,0,0,.18)';for(let i=1;i<7;i++)g.fillRect(W*.06+s*i-1,H*.28,2,H*.23);
  const fl=g.createLinearGradient(0,H*.52,0,H);fl.addColorStop(0,'#b7bbc2');fl.addColorStop(1,'#8d939c');
  g.fillStyle=fl;g.fillRect(-20,H*.52,W+40,H);

  const cy=H*.49,ph0=s*1.55,playing=ph==='play'||ph==='res';
  for(let i=0;i<7;i++){
    const x=sx(i);let e=R.seats[i],a=1,y=cy,jx=0,fx='';
    const isReal=i===R.real,isCand=R.cand.includes(i);
    if(isReal&&R.res==='win'){e='maknae';fx='✨'}
    else if(isReal&&R.res==='lose'){e=R.riv[R.who].e;fx='💢'}
    else if(isReal&&playing&&t>=R.tUp){
      const p=Math.min(1,(t-R.tUp)/.5);
      if(p>=1)e='';else{y-=p*s*.9;a=1-p}
    }else if(isCand&&playing&&t>=.5&&t<R.tUp)jx=Math.sin(now/45)*2.5;
    if(e)ch(e,x+jx,y,ph0,a);
    if(fx)em(fx,x+s*.32,cy-ph0*.9,s*.5);
    if(isReal&&playing&&!R.res&&t>=R.tUp-1.2&&t<R.tFree){const bb=Math.sin(now/110)*4;em('🎒',x+s*.28,cy-ph0*1.25+bb,s*.85);em('❗',x-s*.3,cy-ph0*1.35+bb,s*.45)}
    else if(isCand&&playing&&t>=.5&&t<R.tUp)em('💭',x+s*.32,cy-ph0*.95,s*.42);
  }
  g.fillStyle='#1d6a45';g.fillRect(W*.04,H*.46,W*.92,H*.05);
  if(ph==='play'&&t>=R.tFree&&!R.done){
    const x=sx(R.real),pl=.55+.45*Math.sin(now/90);
    g.strokeStyle=`rgba(255,214,60,${pl})`;g.lineWidth=4;g.strokeRect(x-s*.47,H*.28,s*.94,H*.23);
    em('✨',x,H*.34,s*.6);
  }

  const showP=!(R.res==='win'),rb=H*.6+s*.8,pb=H*.7+s*.95;
  R.riv.forEach((r,i)=>{
    if(R.res==='lose'&&i===R.who)return;
    const x=W*.06+s*(rxf(r)+.5);
    g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,rb,s*.42,s*.12,0,0,7);g.fill();
    ch(r.e,x,rb,s*1.8);
    tx(NM[r.e],x,rb-s*1.8-8,11,'center');
  });
  if(showP){
    const x=W*.06+s*(pxv+.5),bob=Math.abs(px-pxv)>.05?Math.sin(now/70)*3:0;
    g.fillStyle='rgba(255,214,60,.9)';g.beginPath();g.ellipse(x,pb,s*.55,s*.16,0,0,7);g.fill();
    ch('maknae',x,pb-bob,s*2.2,lock>0?.55:1);
    tx('나',x,pb-s*2.2-10,13,'center','#ffd23f');
  }

  tx(`2호선 · ${STN[Math.min(rd,9)]} · ${Math.min(rd+1,10)}/10`,12,H*.04,Math.min(16,W*.042));
  tx('♥'.repeat(Math.max(0,life))+'♡'.repeat(Math.max(0,3-life)),W-12,H*.04,18,'right','#ff6b8a');
  tx(`${sc}점`+(combo>1?` · ${combo}연속`:''),W-12,H*.04+24,14,'right','#ffd23f');
  if(ph==='play'&&!R.done&&t<.5)tx('누가 곧 내릴까?',W/2,H*.8,18,'center');
  if(msg){
    g.globalAlpha=Math.min(1,msg.l*4);
    tx(msg.s,W/2,H*.8,Math.min(W*.08,34)*(1+.2*(msg.l/msg.m)),'center',msg.c);g.globalAlpha=1;
  }
  g.restore();
}

const press=(el,f)=>el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();f()});
press($('bl'),()=>mv(-1));press($('br'),()=>mv(1));press($('bs'),sit);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')mv(-1);else if(e.key==='ArrowRight')mv(1);
  else if(e.key===' '||e.key==='Enter'){if($('ov').style.display!=='flex'){e.preventDefault();sit()}}
});

const mt=$('mt');
function mtUi(){mt.textContent=muted?'🔇':'🔊'}mtUi();
mt.addEventListener('click',()=>{audioInit();muted=!muted;setVol();mtUi();try{localStorage.setItem('subMute',muted?'1':'0')}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
let last=0;
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;upd(dt);draw(now);requestAnimationFrame(loop)}

mk();ph='title';
ov('지하철 자리 쟁탈전','송편 막내가 부장님·상무님·AI보다 먼저 앉아야 해요!\n좌우로 움직여 곧 내릴 승객 앞에 서세요\n💭 말풍선은 후보일 뿐, 🎒 가방을 챙기면 진짜 내려요!\n자리가 비는 순간 ‘앉기!’\n너무 일찍 누르면 민망, 늦으면 뺏겨요\n하트 3개로 10개 역을 버텨 보세요'+(best?`\n\n내 베스트 ${best}점`:''),[['출발',startGame]]);
requestAnimationFrame(loop);
</script>
